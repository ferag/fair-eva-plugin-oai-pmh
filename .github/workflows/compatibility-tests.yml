name: Compatibility tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        fair_eva_ref: ["main", "dev/pre"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FAIR EVA core from ref
        run: |
          # FAIR_EVA_REFS_JSON (repo variable) can be set to e.g.
          # ["main", "refs/tags/vX.Y.Z"] to expand the matrix.
          python -m pip install --upgrade pip
          python -m pip install "fair_eva @ git+https://github.com/IFCA-Advanced-Computing/FAIR_eva@${{ matrix.fair_eva_ref }}"

      - name: Install plugin and test dependencies
        run: |
          python -m pip install -e . --no-deps
          python -m pip install -r test-requirements.txt

      - name: Run compatibility suite
        run: pytest -q
